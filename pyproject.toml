[project]
name = "pipeline-oncall"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JamesV1402", email = "jamesvoinescu@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "httpx>=0.27",
    "typer>=0.15",
    "pydantic>=2.9",
    "networkx>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.7",
]

[project.scripts]
oncall = "pipeline_oncall.cli:app"
pipeline-oncall = "pipeline_oncall:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["dbt: integration tests that shell out to dbt (slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "BLE", "PLW"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline_oncall"]